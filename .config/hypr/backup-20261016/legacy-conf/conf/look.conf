source = ~/.config/hypr/colors.conf

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $surface
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }
}

misc {
    disable_hyprland_logo = true
    vrr = 1
}
