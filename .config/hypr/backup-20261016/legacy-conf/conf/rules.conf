# Window rules (Hyprland >= 0.53 syntax)
windowrule = match:class ^(pavucontrol|nm-connection-editor|org.gnome.Calculator)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:class ^(swappy|com.gabm.satty)$, float on
windowrule = match:class ^(ghostty|com.mitchellh.ghostty)$, opacity 0.92 0.88

# Layer rules
layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(rofi)$, ignore_alpha 0.3
layerrule = match:namespace ^(quickshell)$, blur on
layerrule = match:namespace ^(quickshell)$, ignore_alpha 0.3
