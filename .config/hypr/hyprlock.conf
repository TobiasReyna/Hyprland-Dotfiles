# ==============================================================================
# Hyprlock Configuration with Adaptive Matugen Colors
# ==============================================================================

# Source dynamically generated Matugen colors
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeInOutCubic
    animation = inputFieldDots, 1, 3, easeOutQuint
}

# Blurred dynamic background from current desktop screenshot
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Battery Status Widget (Top Right)
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery-status.sh
    color = $onSurface
    font_size = 13
    font_family = $font
    position = -35, -25
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Keyboard Layout (Top Left)
label {
    monitor =
    text = $LAYOUT
    color = $onSurfaceVariant
    font_size = 12
    font_family = $font
    position = 35, -25
    halign = left
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Large Accent Clock (Modern Typography)
label {
    monitor =
    text = $TIME
    color = $primary
    font_size = 96
    font_family = $font ExtraBold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Date (Capitalized and Localized)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B de %Y" | awk '{print toupper(substr($0,1,1)) substr($0,2)}'
    color = $onSurface
    font_size = 18
    font_family = $font Medium
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# User Greeting
label {
    monitor =
    text =   $USER
    color = $onSurface
    font_size = 15
    font_family = $font SemiBold
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Modern Responsive Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surfaceContainerAlpha
    font_color = $onSurface
    fade_on_empty = false
    placeholder_text = <span alpha="65%">󰌾  Ingresar contraseña...</span>
    hide_input = false
    rounding = 24
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $error
    position = 0, -65
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.2)
}
